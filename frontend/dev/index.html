<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="data:," />
  <title>EatFresh Panel (Dev)</title>
  <link rel="stylesheet" href="/frontend/dev/theme.css" />
</head>
<body>
  <!-- Dev page with a fake `hass` (dev/mock-hass.js, all data invented). Options are listed there. -->
  <script type="module">
    import { createMock } from "/frontend/dev/mock-hass.js";
    const { hass, dark } = createMock();
    if (dark) document.documentElement.dataset.theme = "dark";

    const prefix = location.pathname.startsWith("/eatfresh") ? "/eatfresh" : location.pathname.replace(/\/$/, "");
    const routeNow = () => ({ prefix, path: location.pathname.startsWith(prefix) ? location.pathname.slice(prefix.length) : "" });

    await import("/custom_components/eatfresh/frontend/eatfresh-panel.js");
    const panel = document.createElement("eatfresh-panel");
    panel.hass = hass;
    panel.narrow = innerWidth < 870;
    panel.route = routeNow();
    panel.panel = { config: {} };
    document.body.append(panel);

    // Same behaviour as the Home Assistant frontend.
    window.addEventListener("location-changed", () => (panel.route = routeNow()));
    window.addEventListener("popstate", () => (panel.route = routeNow()));
    window.addEventListener("resize", () => (panel.narrow = innerWidth < 870));
    window.addEventListener("hass-toggle-menu", () => { window.menuToggles = (window.menuToggles ?? 0) + 1; });
    // Simulate a hass update every few seconds (new object, same data).
    setInterval(() => (panel.hass = { ...hass }), 3000);
  </script>
</body>
</html>
