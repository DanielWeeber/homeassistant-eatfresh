name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-11-15
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, pinned 2026-11-15
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -q

  panel:
    # The built panel and card files are committed; they must match their source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-11-15
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, pinned 2026-11-15
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install panel dependencies
        working-directory: frontend
        run: npm ci
      - name: Build panel
        working-directory: frontend
        run: npm run build
      - name: Built files match the source
        run: |
          git diff --exit-code -- \
            custom_components/eatfresh/frontend/eatfresh-panel.js \
            custom_components/eatfresh/frontend/eatfresh-cards.js
          # A new, untracked build file would slip past git diff.
          test -z "$(git status --porcelain -- custom_components/eatfresh/frontend/)"
